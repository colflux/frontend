services:
  # Desarrollo local con hot reload
  dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8001/api
      - VITE_GEO_API_BASE_URL=http://localhost:8001/api/geo
      - VITE_REPORTES_API_BASE_URL=http://localhost:8001/api/reportes
    command: sh -c "npm install && npm run dev"
    profiles: [dev]

  # Producción con Nginx (imagen ~20MB)
  prod:
    build:
      context: .
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_GEO_API_BASE_URL: ${VITE_GEO_API_BASE_URL:-/api/geo}
        VITE_REPORTES_API_BASE_URL: ${VITE_REPORTES_API_BASE_URL:-/api/reportes}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
        VITE_MAP_STYLE: ${VITE_MAP_STYLE:-https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    profiles: [prod]
